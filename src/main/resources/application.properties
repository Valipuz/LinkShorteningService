# Время жизни ссылки в часах
link.ttl.hours=24
# Лимит переходов, если пользователь его не указал
link.limit.default=10
# Максимальный лимит, который можно задать
link.limit.max=1000
# Длина случайного кода в короткой ссылке
link.code.length=6
# Домен, который подставляется в короткую ссылку
link.domain=clck.ru
# Как часто запускать очистку просроченных ссылок, в минутах
cleanup.interval.minutes=60
# Файлы с данными
storage.users.file=data/users.json
storage.links.file=data/links.json