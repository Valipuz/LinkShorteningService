name: LinkShorteningService CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-verify:
    name: Сборка, тесты и линт
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Lint (Spotless)
        run: ./mvnw -B spotless:check

      - name: Build and test
        run: ./mvnw -B verify
